<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המאמן לאמירנט</title>
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אמירנט">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;600;700&family=Secular+One&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5;--sheet:#FFFFFF;--ink:#1D2430;--muted:#5D6778;--line:#CDD4DF;--soft:#E4E9F1;
  --blue:#2442B8;--blue-ink:#FFFFFF;--mark:#FFE14D;--mark-ink:#1D2430;--good:#1F8A5B;--bad:#C2352B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161F;--sheet:#1A2130;--ink:#E7EBF3;--muted:#9AA4B6;--line:#2E384A;--soft:#232C3D;
    --blue:#93A6FF;--blue-ink:#10151F;--mark:#E9CB2E;--mark-ink:#151A22;--good:#4CC38A;--bad:#F07167;
  }
}
:root[data-theme="dark"]{
  --paper:#11161F;--sheet:#1A2130;--ink:#E7EBF3;--muted:#9AA4B6;--line:#2E384A;--soft:#232C3D;
  --blue:#93A6FF;--blue-ink:#10151F;--mark:#E9CB2E;--mark-ink:#151A22;--good:#4CC38A;--bad:#F07167;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}
header h1{font-family:"Secular One",Assistant,sans-serif;font-weight:400;font-size:clamp(30px,7vw,44px);line-height:1.1;margin:6px 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;padding:14px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
nav button{flex:1;font:inherit;font-weight:600;font-size:16px;padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
nav button[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
h2{font-family:"Secular One",Assistant,sans-serif;font-weight:400;font-size:24px;margin:0 0 10px;line-height:1.2}
h3{font-size:18px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:var(--blue-ink);font-weight:700;cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hl{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 88%,transparent 88%);color:var(--mark-ink);padding:0 .25em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* the ruler */
.ruler{position:relative;height:96px;margin:18px 4px 6px}
.track{position:absolute;left:0;right:0;top:46px;height:2px;background:var(--ink)}
.tick{position:absolute;top:40px;width:1px;height:14px;background:var(--ink)}
.tick.minor{top:43px;height:8px;background:var(--muted)}
.tlab{position:absolute;top:58px;transform:translateX(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.path{position:absolute;top:38px;height:18px;background:var(--mark);border-radius:2px;transform:skewX(-8deg);opacity:.95}
.mk{position:absolute;transform:translateX(-50%);text-align:center;font-size:13px;line-height:1.2;white-space:nowrap}
.mk b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.mk.top{top:0}
.mk.bottom{top:74px}
.pin{position:absolute;top:32px;width:2px;height:30px;transform:translateX(-50%);background:var(--ink)}
.pin.dash{background:repeating-linear-gradient(var(--ink) 0 4px,transparent 4px 7px)}
.pin.est{background:var(--blue);width:3px}

.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px;font-weight:700;font-size:14px}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.tasks .go{margin-inline-start:auto;flex:none}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{flex:none;min-width:62px;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:13px;line-height:1.3}
.day b{display:block;font-size:16px}
.day.today{border-color:var(--ink);border-width:2px}
.day.exam{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.day.done{background:var(--soft)}
.day .k{color:var(--muted)}
.day.exam .k{color:var(--mark-ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* flashcards */
.card{text-align:center;padding:34px 16px 24px}
.en{font-family:"Source Serif 4",Georgia,serif;direction:ltr;unicode-bidi:isolate}
.card .en{font-size:clamp(30px,8vw,44px);font-weight:600}
.card .he{font-size:22px;margin-top:10px;min-height:34px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

/* questions */
.passage{font-family:"Source Serif 4",Georgia,serif;direction:ltr;text-align:left;font-size:17px;line-height:1.7;background:var(--soft);border-radius:10px;padding:14px 16px;max-height:280px;overflow:auto;margin-bottom:14px}
.stem{font-family:"Source Serif 4",Georgia,serif;direction:ltr;text-align:left;font-size:19px;line-height:1.6;margin:6px 0 14px}
.opts{display:grid;gap:8px;direction:ltr}
.opt{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.45}
.opt .l{flex:none;font-family:Assistant,sans-serif;font-weight:700;color:var(--muted);width:18px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.opt.right .l{color:var(--mark-ink)}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.explain{margin-top:14px;padding:12px 14px;border-inline-start:4px solid var(--ink);background:var(--soft);border-radius:4px}
.typebar{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;margin:10px 0}
.typebar .bar{height:10px}
.typebar .bar i.low{background:var(--bad)}
.typebar .bar i.mid{background:var(--mark)}
.typebar .bar i.hi{background:var(--good)}
.miss{border-top:1px solid var(--line);padding:10px 0}
.miss .en{display:block;font-size:15px;text-align:left}
.coach{white-space:pre-wrap}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.field input,label.field select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.insim nav{display:none}
.exambar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;margin:12px 0 10px;font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;min-width:58px;text-align:center;padding:2px 8px;border-radius:6px}
.clock.low{background:var(--bad);color:#fff}
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qdot{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--sheet);color:var(--ink);font-weight:700;cursor:pointer}
.qdot.done{background:var(--soft);border-color:var(--muted)}
.qdot.cur{border-color:var(--blue);color:var(--blue)}
.opt.sel{border:2px solid var(--blue);background:var(--soft)}
.simnav{justify-content:space-between;margin-top:16px}
.chap{text-align:start}
.chapno{color:var(--muted);font-weight:600}
.chap h2{font-size:30px;margin-top:4px}
.chapmeta{font-size:20px;font-weight:700;margin:0 0 8px}
.bigscore{font-size:52px;margin:4px 0 8px}
.bigscore small{font-size:22px;color:var(--muted)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.small-stem{font-size:16px;margin:0 0 4px}
textarea.bk{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;direction:ltr;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px}
details summary{cursor:pointer;color:var(--blue)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{flex:1 1 28%;white-space:nowrap;font:inherit;font-weight:600;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft);flex-wrap:wrap}
.dmain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.dmain .en{font-family:"Source Serif 4",Georgia,serif;font-size:18px;font-weight:600}
.dhe{color:var(--muted)}
.dsearch{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.spk.mini{width:30px;height:30px;font-size:14px}
.btn.mini{padding:4px 10px;font-size:13px;border-radius:8px}
.card .en.phr{font-size:clamp(24px,6vw,34px)}

.center{text-align:center}
.bigemo{font-size:56px;line-height:1;margin:4px 0 8px}
.bigemo.wob{animation:wob 1.8s ease-in-out infinite}
.btn.big{padding:14px 26px;font-size:18px;border-radius:12px}
.gbar{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 0}
.grow{display:flex;gap:12px;align-items:center}
.gnum{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:var(--blue-ink);font-family:"Secular One",Assistant,sans-serif;font-size:22px;box-shadow:0 0 0 3px var(--soft)}
.gmid{flex:1;min-width:0}
.gxp{margin-top:6px;height:8px}
.gxp i{background:linear-gradient(90deg,var(--blue),#8B5CF6);transition:width .6s ease-out}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.gs{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.3}
.gs small{font-weight:400;font-size:11px;color:var(--muted)}
.gs.done{color:var(--good)}
.ring{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--soft) 0);display:inline-block;margin-bottom:2px}
.chal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0}
.gbar.mini{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:12px 0 0}
.gbar.mini .gnum{width:32px;height:32px;font-size:17px;box-shadow:none}
.gbar.mini .gxp{flex:1;margin:0}
.gbar.mini .gs{flex-direction:row;gap:3px;font-size:14px;white-space:nowrap}
.chb{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;padding:9px 8px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;font:inherit}
.chb span{font-size:22px;line-height:1}
.chb small{color:var(--muted);font-size:13px;background:var(--soft);border-radius:999px;padding:0 8px}
.chb[aria-pressed="true"]{border:2px solid var(--blue)}
.chb.boss{background:linear-gradient(135deg,var(--sheet),var(--soft))}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;text-align:center;animation:tin .3s ease-out;transition:opacity .4s,transform .4s}
.toast span{font-size:13px;opacity:.85}
.toast.big{background:var(--mark);color:var(--mark-ink);font-size:18px}
.toast.out{opacity:0;transform:translateY(-8px)}
.xpfloat{position:fixed;left:50%;top:36%;z-index:45;font-family:"Secular One",Assistant,sans-serif;font-size:26px;color:var(--good);text-shadow:0 2px 10px rgba(0,0,0,.18);pointer-events:none;animation:xpup 1.2s ease-out forwards;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation-name:fall;animation-timing-function:ease-in;animation-fill-mode:forwards}
.card.shake{animation:shake .4s}
.card .he.show{animation:reveal .35s ease-out}
.hint{text-align:center;font-size:22px;letter-spacing:.05em;margin:6px 0 0;color:var(--blue);font-weight:700}
.sprhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
.sprclock{font-family:"Secular One",Assistant,sans-serif;font-size:34px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.sprclock.low{color:var(--bad);animation:pulse .6s infinite}
.sprcombo.hot{color:#E8590C}
.sprbar{margin:6px 0 10px}
.sprbar i{transition:width .2s linear;background:var(--good)}
.bosshead{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.monster{font-size:46px;line-height:1;display:inline-block}
.monster.hitme{animation:hitme .5s}
.hpbar{height:10px;margin-top:4px}
.hpbar i{background:var(--bad);transition:width .5s}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.ach{border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.5;line-height:1.3}
.ach.on{opacity:1;border-color:var(--mark);background:linear-gradient(180deg,var(--sheet),var(--soft))}
.ach .ai{font-size:28px;margin-bottom:2px}
.ach small{color:var(--muted);font-size:11px}
.misslist{text-align:right;margin-top:10px}
.tag.hard{border-color:var(--bad);color:var(--bad)}
.tag.good{border-color:var(--good);color:var(--good)}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes fall{to{top:105%;transform:rotate(720deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes reveal{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes hitme{0%{transform:none}30%{transform:scale(.8) rotate(-12deg);filter:brightness(2)}60%{transform:scale(1.1) rotate(8deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.toast,.xpfloat,.card.shake,.monster.hitme,.bigemo.wob,.sprclock.low,.card .he.show{animation:none}}
.opt.heopt{font-family:Assistant,sans-serif;text-align:right;font-size:18px}
.spkrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.spk{font-size:20px;line-height:1;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
.spk.slow{font-size:18px}
.guess{margin-top:4px}
.guess input{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gres{text-align:center;margin:0 0 12px;padding:8px 12px;border-radius:10px}
.gres.ok{background:var(--mark);color:var(--mark-ink)}
.gres.no{border:1px solid var(--bad);color:var(--bad)}
label.sw{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.coachlist{margin:0;padding-inline-start:20px}
.coachlist li{margin:8px 0}
.foot{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:640px){
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  nav button{border:0;border-radius:10px;padding:10px 4px;min-height:48px;font-size:15px}
  nav button[aria-current="page"]{background:var(--soft);color:var(--ink)}
  nav button::before{display:block;font-size:20px;line-height:1.1;margin-bottom:2px}
  nav button[data-arg="today"]::before{content:"◎"}
  nav button[data-arg="vocab"]::before{content:"Aa"}
  nav button[data-arg="practice"]::before{content:"✎"}
  nav button[data-arg="stats"]::before{content:"▤"}
  .wrap{padding:14px 14px 120px}
  header h1{font-size:30px}
  .opt{min-height:52px;padding:13px 14px}
  .btn{min-height:48px}
  .card .en{font-size:40px}
  .card{padding:44px 12px 30px}
}
@media (max-width:520px){
  .stats{grid-template-columns:1fr 1fr}
  .settings{grid-template-columns:1fr}
  .typebar{grid-template-columns:96px 1fr 46px}
  .sheet{padding:16px}
  nav button{font-size:15px}
}

/* ===================== v3 design ===================== */
:root,:root[data-theme="light"]{--paper:#F7F3EC;--sheet:#FFFFFF;--ink:#1E2A32;--muted:#69727D;--line:#EAE2D4;--soft:#F3EEE5;--blue:#0E8A79;--blue-ink:#FFFFFF;--mark:#FFD36E;--mark-ink:#2A2112;--good:#1F9D63;--bad:#E0534A;--accent:#FF7A59;--goodbg:#E4F5EC;--badbg:#FDECEA;--backbg:linear-gradient(160deg,#E7F6F2,#FFF6E6);--frontbg:linear-gradient(160deg,#FFFFFF,#F6F1E8);--shadow:0 1px 2px rgba(30,42,50,.05),0 8px 26px rgba(30,42,50,.07);--owl:#B9784A;--owl2:#F6DDB8;--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121820;--sheet:#1A222C;--ink:#ECEFF3;--muted:#9AA4B1;--line:#2A3442;--soft:#212B37;--blue:#3CC8B4;--blue-ink:#06201C;--mark:#FFD36E;--mark-ink:#2A2112;--good:#3DD68C;--bad:#FF6B63;--accent:#FF8A6B;--goodbg:#173528;--badbg:#3A1E1E;--backbg:linear-gradient(160deg,#16302C,#2A2418);--frontbg:linear-gradient(160deg,#1E2733,#1A222C);--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28);--owl:#C98A5B;--owl2:#4A3626}}
:root[data-theme="dark"]{--paper:#121820;--sheet:#1A222C;--ink:#ECEFF3;--muted:#9AA4B1;--line:#2A3442;--soft:#212B37;--blue:#3CC8B4;--blue-ink:#06201C;--mark:#FFD36E;--mark-ink:#2A2112;--good:#3DD68C;--bad:#FF6B63;--accent:#FF8A6B;--goodbg:#173528;--badbg:#3A1E1E;--backbg:linear-gradient(160deg,#16302C,#2A2418);--frontbg:linear-gradient(160deg,#1E2733,#1A222C);--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28);--owl:#C98A5B;--owl2:#4A3626}
body{font-family:Rubik,Assistant,"Segoe UI",Arial,sans-serif;font-size:17px}
h2{font-family:Rubik,Assistant,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
h3{font-weight:600}
header{position:relative;padding-inline-start:0}
header h1{font-family:Rubik,Assistant,sans-serif;font-weight:800;letter-spacing:-.02em;padding-left:52px}
header p{font-size:15px;padding-left:52px}
.gear{position:absolute;top:4px;left:0;width:44px;height:44px;border-radius:50%;border:0;background:var(--sheet);box-shadow:var(--shadow);font-size:20px;cursor:pointer;color:var(--ink)}
.sheet{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.gbar{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border-radius:14px;font-weight:600;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{border-color:var(--line);background:var(--sheet);color:var(--blue)}
.btn.big{width:100%;padding:15px 20px;font-size:18px;border-radius:16px}
.tag{border-color:var(--line);background:var(--sheet)}
.bar{background:var(--soft)}
.bar i{background:var(--blue);border-radius:999px}
.opt{border-radius:14px;background:var(--sheet);border-color:var(--line);transition:border-color .15s,background .15s}
.opt.right{background:var(--goodbg);border-color:var(--good);color:var(--ink)}
.opt.right .l{color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.sel{border-color:var(--blue);background:var(--soft)}
.explain{border-inline-start-color:var(--blue);border-radius:12px;background:var(--soft)}
.passage{border-radius:14px}
.stat{border:0;background:var(--soft);border-radius:14px}
label.field input,label.field select{border-radius:12px;padding:10px 12px;font-size:16px}
.guess input{border-radius:14px}
.hl{background:linear-gradient(transparent 10%,var(--mark) 10%,var(--mark) 90%,transparent 90%)}
nav{border-bottom:0}
nav button{border:0;background:transparent;font-weight:600}
nav button[aria-current="page"]{background:var(--blue);color:var(--blue-ink)}
/* hero */
.hero{display:flex;gap:10px;align-items:flex-end;margin:16px 0 0}
.owlwrap{flex:none;animation:bob 3.2s ease-in-out infinite}
.bubble{flex:1;min-width:0;background:var(--sheet);border-radius:22px;border-bottom-right-radius:6px;padding:14px 16px 16px;box-shadow:var(--shadow)}
.bubble .say{margin:0 0 6px;font-size:18px;line-height:1.45;font-weight:500}
.bubble .plan{margin:0 0 12px;color:var(--muted)}
.cta{margin-top:4px}
.nameask{display:flex;gap:8px;margin:0 0 12px}
.nameask input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.owl{display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
h2 .owl{display:inline-block;vertical-align:-8px;margin-inline-end:6px;filter:none}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
/* week + moment */
.week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wk{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.wk b{font-size:24px;font-variant-numeric:tabular-nums}
.wk small{color:var(--muted);font-size:12px}
.moment{display:flex;gap:10px;align-items:center;margin-top:12px;background:var(--goodbg);border-radius:14px;padding:10px 12px}
.moment p{margin:0;font-size:15px}
.moment .owl{flex:none;filter:none}
/* journey */
.journey{display:flex;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin}
.stop{flex:none;width:78px;text-align:center;position:relative;font-size:12px;line-height:1.3}
.stop::before{content:"";position:absolute;top:16px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.stop:last-child::before{display:none}
.stop.done::before{background:var(--good)}
.stop .dot{position:relative;z-index:1;display:grid;place-items:center;margin:0 auto 6px;width:34px;height:34px;border-radius:50%;background:var(--sheet);border:3px solid var(--line);font-size:14px;font-weight:700}
.stop.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.stop.now .dot{border-color:var(--blue);box-shadow:0 0 0 5px color-mix(in srgb,var(--blue) 22%,transparent)}
.stop.exam .dot{background:var(--mark);border-color:var(--mark)}
.stop b{display:block;font-size:14px}
.stop small{color:var(--muted);font-size:11px}
.stop em{display:block;font-style:normal;color:var(--blue);font-weight:700;font-size:11px;margin-top:2px}
.tasks li{border-top-color:var(--soft)}
.chk{border-radius:50%}
/* modes */
.seg.modes{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:4px 2px 8px;margin:12px 0 0;scrollbar-width:none}
.seg.modes::-webkit-scrollbar{display:none}
.seg.modes button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;background:var(--sheet);box-shadow:var(--shadow);font-weight:600;white-space:nowrap;position:relative}
.seg.modes button span{font-size:16px}
.seg.modes button[aria-pressed="true"]{color:#fff;background:var(--mc,var(--blue))}
.seg.modes button[data-arg="cards"]{--mc:#0E8A79}
.seg.modes button[data-arg="quiz"]{--mc:#5B5BD6}
.seg.modes button[data-arg="phr"]{--mc:#8E4EC6}
.seg.modes button[data-arg="conn"]{--mc:#D97706}
.seg.modes button[data-arg="dict"]{--mc:#475569}
.seg.modes button[data-arg="sprint"]{--mc:#EA580C}
.seg.modes button[data-arg="boss"]{--mc:#E11D48}
.seg.modes .cnt{font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px;margin-inline-start:2px}
/* flip card */
.cardsheet{padding:16px 16px 14px}
.cardtop{justify-content:space-between;margin-bottom:8px}
.nudge{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:6px 10px;margin:10px 0 0;font-size:14px;line-height:1.35}
.nudge .owl{flex:none;filter:none}
.flip{perspective:1400px;margin:12px 0 10px;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;will-change:transform}
.flip .inner{display:grid;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip.anim .inner{animation:flipin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:26px 16px 20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--frontbg);border:1px solid var(--line)}
.face.front{cursor:pointer}
.face.back{transform:rotateY(180deg);background:var(--backbg)}
.face .en{font-size:clamp(32px,9vw,46px);font-weight:600}
.face .en.small-en{font-size:20px;color:var(--muted);font-weight:600}
.face .he.big{font-size:clamp(26px,7vw,34px);font-weight:700;margin:4px 0 2px;line-height:1.25}
.tapme{margin-top:14px}
.lvchip{font-size:12px;border-radius:999px;padding:2px 10px;margin-bottom:12px;font-weight:600}
.lvchip.lv1{background:#DFF3E8;color:#17734A}
.lvchip.lv2{background:#FFF0CC;color:#8A5A00}
.lvchip.lv3{background:#FDE2E4;color:#B4233A}
.ex{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.5;margin-top:14px;max-width:520px;text-align:left}
.ex mark{background:var(--mark);color:var(--mark-ink);border-radius:5px;padding:0 3px}
.mn{margin-top:12px;font-size:15px;background:var(--sheet);border-radius:12px;padding:8px 12px;border:1px dashed var(--line);max-width:520px}
.flip.lean-yes .face.back{box-shadow:inset 0 0 0 3px var(--good)}
.flip.lean-no .face.back{box-shadow:inset 0 0 0 3px var(--accent)}
.flip::after{position:absolute;top:16px;z-index:3;padding:4px 12px;border-radius:10px;color:#fff;font-weight:700;font-size:18px;transform:rotate(-8deg);opacity:0;transition:opacity .1s}
.flip.lean-yes::after{content:"ידעתי ✓";background:var(--good);opacity:1;left:16px}
.flip.lean-no::after{content:"לא ידעתי";background:var(--accent);opacity:1;right:16px;transform:rotate(8deg)}
.swipehint{text-align:center;margin:4px 0 0}
.actbar{position:sticky;bottom:12px;z-index:4;display:flex;gap:10px;padding:10px 2px 4px;margin-top:-6px;background:linear-gradient(transparent,var(--paper) 35%)}
.actbar .btn{flex:1;min-height:56px;font-size:18px}
.actbar .act.yes{background:var(--good);border-color:var(--good);color:#fff}
.actbar .act.no{background:var(--accent);border-color:var(--accent);color:#fff}
.gres{border-radius:14px}
.gres.ok{background:var(--goodbg);color:var(--ink)}
.gres.no{background:var(--badbg);border:0}
.settings.v3{grid-template-columns:repeat(3,1fr)}
.backupnag{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--sheet),var(--goodbg))}
.backupnag .owl{flex:none}
.notebook h2{margin-bottom:6px}
.gb-vg{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted)}
.gb-vg select{font:inherit;font-size:13px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.estnote{font-size:12.5px;color:var(--muted);margin:6px 0 0}

.goalbar{position:sticky;top:0;z-index:8;margin:10px 0 4px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.07)}
body.insim .goalbar{display:none}
.gb-main{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;background:none;border:0;color:var(--ink);font:inherit;text-align:right;cursor:pointer}
.gb-ring{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center}
.gb-ring b{position:absolute;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.gring .gr-bg{fill:none;stroke:var(--soft);stroke-width:5}
.gring .gr-fg{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s}
.gb-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.gb-txt b{font-size:15px}
.gb-txt small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-chips{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;text-align:left;flex:none}
.gb-chev{color:var(--muted);font-size:12px;flex:none}
.gb-detail{padding:4px 14px 14px;border-top:1px solid var(--line)}
.gb-goals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px}
.gb-goal{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:6px 4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.gb-goal small{font-weight:400;color:var(--muted);font-size:11.5px}
.gb-goal.on{border-color:var(--good);background:var(--goodbg,rgba(31,138,91,.1));box-shadow:0 0 0 1px var(--good)}
.gm{margin-top:12px}
.gm-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.gm-num{font-weight:700;font-variant-numeric:tabular-nums}
.gm-bar{height:9px;border-radius:999px;background:var(--soft);overflow:hidden;margin:5px 0 3px}
.gm-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--good),#4CC38A);transition:width .6s}
.gm small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.gb-next{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;background:var(--paper);border-radius:12px;padding:8px 10px;font-size:14px}
.gb-note{font-size:11.5px;color:var(--muted);margin:10px 0 0}
@media (max-width:360px){.gb-chips{display:none}}

.settings.v3>*{min-width:0}
.settings.v3 input,.settings.v3 select{width:100%;min-width:0;box-sizing:border-box}
@media (max-width:560px){.settings.v3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aiset select,.aiset input[type=text],.aiset input[type=password],.aitool select,.aitool input{width:100%;min-width:0;box-sizing:border-box}
nav button[data-arg="ai"]::before{content:"🤖"}
body.aiopen{overflow:hidden}
.aiback{position:fixed;inset:0;z-index:46;background:rgba(10,15,25,.45);animation:aiFade .2s}
.aisheet{position:fixed;left:0;right:0;bottom:0;z-index:47;max-height:88vh;overflow-y:auto;background:var(--sheet);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));animation:aiUp .28s cubic-bezier(.2,1,.3,1);max-width:640px;margin:0 auto}
@keyframes aiUp{from{transform:translateY(40px);opacity:0}}
@keyframes aiFade{from{opacity:0}}
.aihead{position:sticky;top:0;background:var(--sheet);display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px;z-index:1}
.aihead b{font-size:18px}
.aix{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px;cursor:pointer}
.aisteps{padding-right:20px;margin:6px 0}
.aisteps li{margin-bottom:16px}
.aisteps li>b{display:block;margin-bottom:6px}
.aisteps small{display:block;color:var(--muted)}
.aisteps textarea{width:100%;min-height:110px;margin:6px 0 8px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--paper);color:var(--ink);box-sizing:border-box}
.aipre{white-space:pre-wrap;word-break:break-word;font-size:11.5px;max-height:180px;overflow:auto;background:var(--paper);border-radius:8px;padding:8px;margin:6px 0 0}
.aierr{background:var(--badbg,#fde8e7);color:var(--bad);border-radius:10px;padding:10px 12px}
.aiload{text-align:center;padding:26px 0}
.aispin{display:inline-block;width:38px;height:38px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent,#2442B8);animation:aiSpin .8s linear infinite}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.aiacts{margin-top:12px}
.aidisc{margin-top:14px}
.aiwords{display:grid;gap:8px;margin:8px 0}
.aiw{background:var(--paper);border-radius:10px;padding:8px 10px}
.aiw small{display:block;margin-top:3px;color:var(--muted)}
.aiw mark,.aiex mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.aiplan{display:grid;gap:8px}
.aiplan>div{background:var(--paper);border-radius:10px;padding:8px 12px}
.aiplan ul,.aihome ul{margin:4px 0;padding-right:18px}
.aiprev{background:var(--paper);border-radius:10px;padding:10px;font-family:Georgia,serif}
.aiset h2 small{font-size:13px;font-weight:400}
.airadio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.airadio.on{border-color:var(--accent,#2442B8);box-shadow:0 0 0 1px var(--accent,#2442B8)}
.airadio.dis{opacity:.6}
.airadio input{margin-top:4px}
.airadio b{display:block}
.airadio small{display:block;color:var(--muted);line-height:1.4}
.aiset .field{margin-top:10px}
.aiset .row{margin-top:8px;flex-wrap:wrap}
.aitest{margin:6px 0 0}
.aitool textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--paper);color:var(--ink);box-sizing:border-box;font:14px/1.4 inherit;margin-top:6px}
.aiformrow{gap:10px;flex-wrap:nowrap}
.aiformrow .field{flex:1}
.aitool .btn{margin-top:10px}
.aisetrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.aisetrow>div{flex:1}
.aisetrow small{display:block}
.linkish{background:none;border:0;color:var(--accent,#2442B8);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.aiwhybtn{margin-top:10px}
.rgfb .chipbtn{margin-top:8px;display:inline-block}

body.rgopen{overflow:hidden}
body.rgopen .xpfloat{display:none}
.rgx,.rgintro,.rghome{--felt:radial-gradient(130% 85% at 50% 18%,#1F7D60 0%,#135840 46%,#0A3328 100%);--cream:linear-gradient(180deg,#FFFDF6,#F5EAD2);--txt:#F3FFF9;--dimc:rgba(243,255,249,.64);--gold:#F5C542}
.rgx{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--felt);color:var(--txt);font-family:Rubik,Assistant,"Segoe UI",Arial,sans-serif}
.rgx::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);box-shadow:inset 0 0 160px rgba(0,0,0,.55)}
.rgwrap{position:relative;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0}
.rgbody{flex:1;padding-bottom:14px}
.rgfoot{position:sticky;bottom:0;z-index:3;margin:auto -14px 0;display:flex;gap:10px;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(8,40,31,0),rgba(8,40,31,.92) 36%)}
.rgfoot .gbtn{white-space:nowrap}
.rgfoot .gbtn:not(.gold){font-size:17px}
.rgbody.table{display:flex;flex-direction:column}
.rgbody.table .handbar{margin-top:auto}
.tablehint{margin:auto 0;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(243,255,249,.75)}
.tablehint:empty{display:none}
.tablehint b{font-family:"Secular One",Rubik,sans-serif;font-size:30px;color:rgba(255,255,255,.92);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.tablehint span{font-size:14px}
.rgbody.center-v{justify-content:center}
.rgx summary,.rgintro summary{color:#fff}
.rgx .dim,.rgintro .dim{color:var(--dimc)}
.rgx h2,.rgx h3{color:inherit}
.rgtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rgtitle{flex:1;font-family:"Secular One",Rubik,sans-serif;font-size:19px}
.rgtitle span{opacity:.55}
.rgcoins{background:rgba(0,0,0,.32);border:1px solid rgba(245,197,66,.45);border-radius:999px;padding:4px 12px;font-weight:700;color:#FFD86B;font-variant-numeric:tabular-nums}
.rgclose{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:16px;cursor:pointer}
.rghud{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.rghud.boss{border-color:rgba(240,72,78,.45)}
.hud1{display:flex;align-items:center;gap:10px}

PASSAGES.push(
{d:1,topic:"the placebo effect",text:"A placebo is a treatment that has no active medical ingredient, such as a sugar pill. Surprisingly, patients who receive a placebo often report that they feel better. This phenomenon, known as the placebo effect, has been observed in studies of pain, depression, and sleep problems. Researchers believe that a patient's expectations play a central role: when people believe a treatment will help them, their brains may release natural chemicals that reduce pain and improve mood. The effect is strongest when the treatment seems convincing. For example, two pills tend to work better than one, and injections often work better than pills, even when none of them contain any medicine. Because of the placebo effect, new drugs must be tested carefully. In most trials, one group of patients receives the real drug and another group receives a placebo, and neither the patients nor the doctors know who received which. Only if the drug performs better than the placebo is it considered effective. Some doctors now wonder whether the placebo effect could be used deliberately to help patients, but this raises ethical questions, since it may involve deceiving them.",qs:[
Q(1,"main","The passage mainly discusses",["what the placebo effect is and why it matters in medicine","how sugar pills are produced","why injections are better than pills","the history of depression treatment"],"הקטע מגדיר את אפקט הפלצבו ומסביר את חשיבותו בניסויים. C היא דוגמה אחת בלבד."),
Q(1,"detail","According to the passage, the placebo effect is strongest when",["the treatment seems convincing to the patient","the patient takes only one pill","the doctor explains that the pill is fake","the treatment contains a small amount of medicine"],"The effect is strongest when the treatment seems convincing."),
Q(1,"detail","Why are both patients and doctors kept unaware of who receives the real drug?",["so that expectations do not influence the results","because the drug is dangerous","because placebos are expensive","so that doctors can give extra treatment"],"המטרה היא לנטרל ציפיות, שהן הגורם לאפקט הפלצבו."),

{d:2,topic:"ancient maps",text:"Maps are among the oldest forms of human communication, yet early maps were rarely intended to be accurate in the modern sense. Many medieval European maps, for example, placed Jerusalem at the center of the world, not because mapmakers were ignorant of geography but because the city held enormous religious significance for them. Such maps expressed a worldview as much as they described physical space. Distances were often distorted, and regions considered unimportant were shrunk or left out altogether. The shift toward accuracy came gradually. Sailors needed reliable charts to navigate safely, and governments wanted precise maps to collect taxes and defend their borders. By the eighteenth century, new instruments and methods of measurement allowed mapmakers to represent coastlines and mountains with remarkable precision. Nevertheless, historians caution against assuming that modern maps are entirely neutral. Every map involves choices about what to include, what to emphasize, and how to represent a round planet on a flat surface. The widely used Mercator projection, for instance, makes countries near the poles appear much larger than they really are, which some critics argue has shaped how people perceive the relative importance of different regions.",qs:[
Q(2,"main","The main idea of the passage is that",["maps have always reflected choices and values, not only geographical facts","medieval mapmakers did not understand geography","modern maps are completely accurate and neutral","the Mercator projection should no longer be used"],"הקטע מראה שגם מפות ישנות וגם חדשות משקפות בחירות. B נשללת במפורש בקטע."),
Q(2,"detail","According to the passage, Jerusalem appeared at the center of many medieval maps because",["it was important to the mapmakers' religious beliefs","it was the largest city in the world","mapmakers did not know where it was located","it was the center of trade routes"],"not because mapmakers were ignorant... but because the city held enormous religious significance."),
Q(2,"detail","Which of the following is mentioned as a reason for the move toward more accurate maps?",["the needs of sailors and governments","the decline of religion","the invention of the airplane","the demands of tourists"],"Sailors needed reliable charts... governments wanted precise maps."),

Q(3,"infer","The author mentions the Mercator projection in order to",["give an example of how a modern map can influence perception","prove that old maps were more accurate","show that eighteenth-century instruments were imprecise","describe the shape of the coastlines"],"הדוגמה ממחישה את הטענה שגם מפות מודרניות אינן ניטרליות.")]},
{d:2,topic:"bilingual children",text:"For much of the twentieth century, many parents and teachers believed that raising a child with two languages would cause confusion and slow down the child's development. Some even advised immigrant families to speak only the language of their new country at home. Research conducted over the past few decades has largely overturned this view. Studies show that bilingual children reach the major milestones of language development at roughly the same age as children who speak one language. Although bilingual children may know fewer words in each individual language, the total number of words they know in both languages is usually similar to, or greater than, that of monolingual children. Moreover, some research suggests that switching between languages may train the brain to focus attention and ignore distractions, abilities that psychologists call executive functions. These findings, however, remain debated. Several recent studies have failed to find a clear advantage, and some researchers argue that earlier positive results were exaggerated because studies showing no effect were less likely to be published. What most experts do agree on is that bilingualism does not harm children, and that maintaining a family's heritage language can strengthen ties between generations.",qs:[

{d:3,topic:"desert cities",text:"Cities in desert regions face a problem that grows more urgent every year: how to supply water to rapidly expanding populations in places where rain rarely falls. Historically, desert communities relied on underground water sources and on ingenious systems of tunnels that carried water from distant mountains. Today, many such cities depend instead on pumping groundwater at rates far greater than nature can replace, a practice that cannot continue indefinitely. As underground reserves shrink, wells must be drilled deeper, increasing costs and, in some coastal areas, allowing salt water to seep into freshwater supplies. Desalination, the process of removing salt from seawater, offers one solution, and several countries now obtain a substantial share of their drinking water this way. Yet desalination consumes large amounts of energy and produces a highly salty waste product that can damage marine ecosystems if it is not disposed of carefully. Consequently, many experts argue that technology alone will not solve the problem. They point out that significant savings could be achieved by repairing leaking pipes, recycling wastewater for agriculture, and encouraging residents to replace lawns with plants adapted to dry conditions. Such measures are less dramatic than building new plants, but they are often far cheaper and can be implemented more quickly.",qs:[

Q(3,"detail","According to the passage, one disadvantage of desalination is that it",["requires a great deal of energy","cannot produce drinking water","is used by very few countries","removes too little salt"],"desalination consumes large amounts of energy."),

{d:1,topic:"the history of chocolate",text:"Chocolate is enjoyed all over the world today, but for most of its history it was consumed very differently. The cacao tree is native to Central and South America, where ancient peoples such as the Maya and the Aztecs prepared a bitter drink from its beans. They often mixed it with spices, water, and sometimes chili pepper. The drink was highly valued, and cacao beans were even used as a form of money. When Spanish explorers brought cacao to Europe in the sixteenth century, the drink was at first unpopular because of its bitter taste. Europeans soon began adding sugar and honey, and chocolate became a fashionable drink among wealthy people. For a long time it remained a luxury. This changed in the nineteenth century, when new machines made it possible to produce chocolate cheaply and in large quantities. Inventors also discovered how to turn liquid chocolate into solid bars, and later how to add milk to create a softer, sweeter product. As a result, chocolate became available to ordinary people. Today, however, cacao farmers in West Africa, where most of the world's cacao is now grown, often earn very little, a problem that several organizations are trying to address.",qs:[

{d:2,topic:"social media and news",text:"A growing proportion of people, particularly young adults, now get their news primarily through social media rather than from newspapers or television. This shift has clear advantages. News spreads faster than ever, and ordinary citizens can report events as they happen, sometimes before professional journalists arrive. Social media also gives a voice to communities whose concerns were often ignored by traditional outlets. At the same time, the change has created serious problems. Because social media platforms are designed to keep users engaged, they tend to promote content that provokes strong emotions, such as anger or fear. False stories, which are often more surprising than true ones, can therefore spread more widely than accurate reporting. In addition, users are frequently shown content that matches their existing opinions, which may make them less aware of other points of view. Some governments have responded by passing laws that require platforms to remove false information, but critics warn that such laws could be used to silence legitimate criticism. Many researchers believe that the most effective long-term response is education: teaching people of all ages how to evaluate sources, check facts, and recognize content designed to manipulate them.",qs:[

{d:3,topic:"the decline of insects",text:"In recent years, several long-term studies have reported dramatic declines in insect populations. One frequently cited study from Germany found that the total mass of flying insects in protected nature areas had fallen by more than seventy-five percent over twenty-seven years. Because insects pollinate crops, recycle nutrients, and serve as food for birds and other animals, such losses could have far-reaching consequences for entire ecosystems and for human agriculture. Identifying the causes, however, has proven difficult. The leading suspects include the destruction of natural habitats, the widespread use of pesticides, and climate change, but these factors often act together, making it hard to determine the contribution of each. Moreover, reliable historical data on insects are scarce. Unlike birds or mammals, insects were rarely counted systematically in the past, so scientists often lack a clear baseline against which to measure change. Some researchers have therefore cautioned against generalizing from a small number of studies, noting that certain insect groups appear to be stable or even increasing in some regions. Nevertheless, most entomologists agree that the overall trend is worrying and that waiting for perfect data before acting would be unwise, given how much depends on these small but essential creatures.",qs:[

{d:2,topic:"the four-day work week",text:"In several countries, companies have begun experimenting with a four-day work week in which employees work fewer hours for the same pay. Supporters argue that the traditional five-day schedule was designed for factory work in a different era and is poorly suited to modern jobs, many of which depend on concentration and creativity rather than the number of hours spent at a desk. In a number of trials, employers reported that productivity remained stable or even rose, while employees described lower levels of stress and greater satisfaction with their work. Some companies also found it easier to attract and keep talented staff. Critics, however, point out that the results may not apply to all types of work. In hospitals, schools, and shops, for example, services must be available for a certain number of hours, so reducing working time could require hiring additional workers, which would raise costs. Others note that many trials involved companies that volunteered to take part and were therefore likely to be enthusiastic about the idea, which may have made the results look better than they would be elsewhere. For now, the four-day week remains a promising but unproven model.",qs:[
Q(2,"main","The passage mainly discusses",["the possible advantages and limitations of a four-day work week","why factories invented the five-day week","how to reduce stress at work","the high cost of hiring workers in hospitals"],"הקטע מציג טיעונים בעד ונגד. D היא דוגמה אחת בלבד."),

Q(2,"detail","Why might a four-day week increase costs in hospitals and shops?",["Additional workers might need to be hired","Employees would demand higher pay","Productivity would fall dramatically","Customers would stop coming"],"could require hiring additional workers, which would raise costs."),

{d:1,topic:"the ancient Olympic Games",text:"The first recorded Olympic Games took place in Olympia, in southern Greece, in 776 BCE. For many years the festival consisted of a single event, a short running race of about 190 meters. Over time, new contests were added, including wrestling, boxing, chariot racing, and the pentathlon, which combined five different events. The Games were held every four years in honor of Zeus, the king of the Greek gods, and they were as much a religious celebration as a sporting competition. During the festival, a sacred truce was declared so that athletes and spectators could travel safely to Olympia, even from cities that were at war with each other. Only free Greek men were allowed to compete, and married women were not permitted to watch. Winners did not receive money or medals; instead, they were given a crown made of olive leaves. However, a victory brought enormous fame, and champions were often rewarded generously when they returned to their home cities. The ancient Games continued for more than a thousand years before they were finally abolished at the end of the fourth century CE.",qs:[

{d:2,topic:"octopus intelligence",text:"Octopuses have long fascinated scientists because they display a level of intelligence rarely found among animals without a backbone. In laboratory studies, octopuses have learned to open jars, find their way through mazes, and recognize individual human caretakers, sometimes squirting water at people they appear to dislike. In the wild, some species collect coconut shells and carry them across the sea floor, later assembling them into a shelter, a behavior that many researchers consider a form of tool use. What makes this intelligence especially puzzling is the octopus's unusual nervous system. Roughly two-thirds of its neurons are located not in its brain but in its eight arms, each of which can taste, touch, and react to its surroundings with a surprising degree of independence. This arrangement suggests that octopus intelligence evolved along a completely different path from that of mammals and birds. Yet octopuses live remarkably short lives, usually only one or two years, and most die soon after reproducing. Scientists are still trying to understand why an animal with such a short life span would develop such a sophisticated mind, since intelligence is often thought to be most useful to long-lived, social species.",qs:[

{d:1,topic:"procrastination",text:"Almost everyone delays unpleasant tasks from time to time, but for some people procrastination becomes a serious problem that harms their studies, work, and health. For many years, procrastination was seen mainly as a problem of poor time management or laziness. Recent research, however, suggests that it is often an emotional issue. People tend to put off tasks that make them feel anxious, bored, or uncertain, and they turn to more pleasant activities to escape those feelings in the short term. Unfortunately, the relief does not last. As the deadline approaches, stress increases, and the person often feels guilty for having wasted time. Because of this, experts recommend strategies that focus on emotions rather than schedules. One simple technique is to commit to working on a task for only five minutes. Starting is usually the hardest part, and once people begin, they frequently continue for much longer. Another strategy is to be kind to oneself after procrastinating. Studies have found that students who forgave themselves for delaying their studying before one exam were less likely to procrastinate before the next one.",qs:[

{d:3,topic:"electric car batteries",text:"Electric vehicles are often promoted as a key solution to climate change, and in many countries their sales have grown rapidly. Because they produce no exhaust, they reduce air pollution in cities, and when charged with electricity from renewable sources, their total emissions can be far lower than those of conventional cars. Nevertheless, the batteries that power these vehicles raise difficult questions. Producing them requires large quantities of minerals such as lithium, cobalt, and nickel, and mining these materials can damage local environments and, in some regions, has been linked to poor working conditions. Moreover, manufacturing a battery consumes so much energy that an electric car begins its life with a larger carbon footprint than a gasoline car; it must be driven for a considerable distance before its overall emissions become lower. Researchers are therefore pursuing several approaches at once. Some are developing batteries that rely on more abundant materials, while others are improving recycling methods so that valuable metals can be recovered from old batteries. Whether these efforts succeed will determine not only the environmental benefits of electric cars but also whether the supply of critical minerals can keep pace with rising demand.",qs:[

{d:2,topic:"the history of vaccination",text:"In the eighteenth century, smallpox was one of the deadliest diseases in the world, killing millions and leaving many survivors scarred or blind. People had long observed that those who survived smallpox never caught it again, and in parts of Asia and Africa a risky practice called variolation was used: healthy people were deliberately infected with material from a mild case, hoping they would develop only a light illness. In 1796, the English doctor Edward Jenner tested a safer idea. He had heard that milkmaids who caught cowpox, a mild disease of cattle, seemed to be protected from smallpox. Jenner infected a boy with cowpox and later exposed him to smallpox; the boy did not become ill. The procedure became known as vaccination, from the Latin word for cow. Despite early resistance, vaccination spread across the world. Nearly two centuries later, in 1980, the World Health Organization declared smallpox completely eradicated, the first human disease ever eliminated through deliberate effort. Today, Jenner's method is sometimes criticized on ethical grounds, since he experimented on a child, but his work laid the foundation for vaccines that have saved hundreds of millions of lives.",qs:[

{d:2,topic:"the Silk Road",text:"The Silk Road was not a single road but a vast network of trade routes that connected China with Central Asia, the Middle East, and Europe for more than 1,500 years. Its name comes from the valuable Chinese silk that was carried westward, but many other goods traveled along it as well, including spices, precious metals, glass, and horses. Few merchants traveled the entire distance. Instead, goods usually passed from one trader to another, changing hands many times and becoming more expensive at each stage. The Silk Road was also a highway for ideas. Religions such as Buddhism spread from India into China along these routes, and technologies such as papermaking gradually moved from China to the Islamic world and later to Europe. Unfortunately, diseases traveled too; many historians believe that the plague known as the Black Death reached Europe in the fourteenth century partly through these trade networks. The importance of the land routes declined after the fifteenth century, when European sailors found sea routes to Asia that were faster and cheaper for carrying large quantities of goods.",qs:[

{d:3,topic:"volcanoes and climate",text:"Large volcanic eruptions can influence the global climate, but not always in the way people expect. Although eruptions release carbon dioxide, a greenhouse gas, the amount is small compared with that produced by human activity. The more significant short-term effect is actually cooling. When a powerful eruption sends sulfur dioxide high into the stratosphere, the gas forms tiny droplets that reflect sunlight back into space. Because these droplets can remain in the upper atmosphere for months or even years, they may lower average global temperatures noticeably. The 1991 eruption of Mount Pinatubo in the Philippines, for example, cooled the planet by about half a degree Celsius over the following year. An even more dramatic case occurred in 1815, when the eruption of Mount Tambora in Indonesia was followed by what became known as the \"year without a summer\" in parts of Europe and North America, as crops failed and food prices soared. Some scientists have proposed deliberately imitating this natural effect by releasing reflective particles into the atmosphere to slow global warming. Critics warn, however, that such a plan could have unpredictable consequences for rainfall patterns and would not address the underlying cause of climate change.",qs:[

{d:3,topic:"the minimum wage debate",text:"Few economic policies provoke as much debate as the minimum wage. Supporters argue that raising the legal minimum is a direct way to reduce poverty and to ensure that full-time workers can afford basic needs. They also point out that low-paid workers tend to spend most of their additional income, which can stimulate demand and benefit local businesses. Opponents traditionally reply with a simple economic argument: if labor becomes more expensive, employers will hire fewer workers, so a higher minimum wage may hurt the very people it is intended to help. For decades, this prediction was widely accepted. In the 1990s, however, a famous study compared fast-food restaurants in two neighboring American states, one of which had raised its minimum wage. The researchers found no evidence that employment fell in the state with the higher wage. Their findings sparked a long controversy and inspired hundreds of further studies. Today, many economists agree that moderate increases have little effect on employment, but considerable disagreement remains about where the limit lies, and whether very large increases, particularly in regions where average wages are low, might eventually lead to job losses.",qs:[

function migrateV5(){
  if((S.v||0)>=5) return;
  const isAi=id=>String(id||"").startsWith("ai-");
  const before=S.attempts.length; S.attempts=S.attempts.filter(a=>!isAi(a.id));
  let had=before!==S.attempts.length;
  for(const k of Object.keys(S.items)) if(isAi(k)){ delete S.items[k]; had=true; }
  if(had){ const sk={}; for(const it of ITEMS){ const r=S.items[it.id]; if(r){ const o=sk[it.skill]||(sk[it.skill]={n:0,ok:0}); o.n+=r.n||0; o.ok+=r.ok||0; } } S.skills=sk; }
  S.gh={}; if(S.goalHit&&typeof S.goalHit==="string") delete S.goalHit;
  S.v=5;
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
}

  const ok=a.filter(x=>x.ok).length;
  const ms=a.length?Math.round(a.reduce((s,x)=>s+(x.ms||0),0)/a.length/1000):0;

function planFor(k){
  const left=diff(k,S.examDate);
  if(left<0) return null;
  if(left===0) return {kind:"exam",label:"מבחן",nw:0,q:0};
  if(left===1) return {kind:"rest",label:"חזרה קלה",nw:0,q:8};
  if(left<=3) return {kind:"sim",label:"סימולציה",nw:Math.round(10*(S.nwDaily||25)/25),q:25};
  const f=(S.nwDaily||25)/25;
  if(ORIENT.includes(k)) return {kind:"light",label:"קליל",nw:Math.round(12*f),q:8};
  return {kind:"normal",label:"רגיל",nw:Math.round(25*f),q:15};
}
function dayDone(k){
  const p=planFor(k); if(!p||p.kind==="exam") return false;
  const d=dayRead(k);
  return d.nw>=p.nw && (p.kind==="sim"?simToday(k):d.ans>=p.q);
}
function streak(){
  let n=0,k=today();
  const act=x=>{const d=dayRead(x);return d.ans>0||d.rv>0||d.nw>0;};
  if(!act(k)) k=addDays(k,-1);
  while(act(k)){ n++; k=addDays(k,-1); }
  return n;
}

  const rev=Math.random()<0.35;

const normHe=x=>String(x||"").replace(/[\u0591-\u05C7]/g,"").replace(/\([^)]*\)/g," ").replace(/[^\u05D0-\u05EAa-z\s-]/gi," ").replace(/\s+/g," ").trim();
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }

function guessMatch(guess,he){

  const gWords=g.split(" ").filter(w=>w.length>1);
  for(const t of targets){
    if(t===g||t.includes(g)&&g.length>=3||g.includes(t)) return true;
    const tWords=t.split(" ").filter(w=>w.length>1);
    for(const a of gWords) for(const b of tWords){
      const A=strip(a),B=strip(b), L=Math.max(A.length,B.length);

function freshRandom(n,skip){
  skip=skip||new Set();
  const pool=allWords().filter(w=>!S.cards[w.en]&&!skip.has(w.en)&&w.he);
  const cust=new Set(S.custom.map(c=>c.en));
  const rest=pool.filter(w=>!cust.has(w.en)).map(w=>({w,k:Math.pow(Math.random(),1/wOf(w.en))})).sort((a,b)=>b.k-a.k).map(x=>x.w);
  return pool.filter(w=>cust.has(w.en)).concat(rest).slice(0,n);

function hlWord(sentence,en){

function initTheta(){
  if(!S.theta){ const t0=(S.base-113)/15; S.theta={sc:t0,rs:t0,rc:t0}; S.thetaN={sc:0,rs:0,rc:0}; }
}
const bOf=it=>(it.d-2)*1.1;
function smAcc(o){ o=o||{n:0,ok:0}; return (o.ok+2)/(o.n+4); }
function typeAcc(t){ const a=S.attempts.filter(x=>x.type===t).slice(-40); return smAcc({n:a.length,ok:a.filter(x=>x.ok).length}); }
function itemScore(it,t){
  initTheta();
  const target=S.theta[it.type]-0.3;
  const fit=Math.exp(-((bOf(it)-target)**2)/0.9);
  const weak=1-smAcc(S.skills[it.skill]);
  const r=S.items[it.id]; let rec=0.6;
  if(r){ const ds=diff(r.last,t); rec = !r.lastOk ? (ds>=1?1.1:-2) : (ds<3?-1.6:ds<7?-0.6:-0.1); }
  const c=it.word&&S.cards[it.word.toLowerCase()];
  return 1.2*fit + 1.2*weak + rec + (c&&c.box<=1?0.3:0) + Math.random()*0.25;
}
function pickTop(type,k,t){
  return ITEMS.filter(it=>it.type===type).map(it=>({it,s:itemScore(it,t)})).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.it);
}
function bestPassage(t,k){
  let best=null;
  PASSAGES.forEach((p,pi)=>{
    const its=ITEMS.filter(x=>x.pid===pi).map(it=>({it,s:itemScore(it,t)})).sort((a,b)=>b.s-a.s).slice(0,k);
    const avg=its.reduce((s,x)=>s+x.s,0)/its.length;
    if(!best||avg>best.avg) best={pid:pi,avg,items:its.map(x=>x.it).sort((a,b)=>a.id<b.id?-1:1)};
  });
  return best;
}
function prepQ(it){
  const idx=shuffle([0,1,2,3]);
  return {id:it.id,type:it.type,skill:it.skill,d:it.d,passage:it.pid!==undefined?PASSAGES[it.pid].text:"",stem:it.stem,options:idx.map(i=>it.options[i]),answer:idx.indexOf(it.answer),explain:it.explain||"",word:it.word||"",wordHe:it.wordHe||(it.word?heOf(it.word):"")};
}
function explainSet(items){
  const t=today(), cnt={sc:0,rs:0,rc:0}, sk={};
  let rev=0, dsum=0;
  for(const it of items){ cnt[it.type]++; sk[it.skill]=(sk[it.skill]||0)+1; dsum+=it.d; const r=S.items[it.id]; if(r&&!r.lastOk) rev++; }
  const parts=["sc","rs","rc"].filter(x=>cnt[x]).map(x=>cnt[x]+" "+TYPES[x]);
  const weakSk=Object.keys(sk).filter(k=>(S.skills[k]||{n:0}).n>=3).sort((a,b)=>smAcc(S.skills[a])-smAcc(S.skills[b])).slice(0,2).map(k=>SKILLS[k][0]);
  const avg=dsum/items.length, lvl=avg<1.6?"בסיסית":avg<2.4?"בינונית":"גבוהה";
  let s="בסט: "+parts.join(", ")+". רמת קושי "+lvl+".";
  if(weakSk.length) s+=" דגש על "+weakSk.join(" ו")+".";
  if(rev) s+=" "+rev+" שאלות חוזרות על טעויות קודמות.";
  return s;
}
function smartSet(){
  const t=today(), w={sc:1-typeAcc("sc")+0.15,rs:1-typeAcc("rs")+0.15,rc:1-typeAcc("rc")+0.15};
  const nrc=(w.rc>=Math.max(w.sc,w.rs)*0.85 || S.attempts.filter(x=>x.type==="rc").length<5)?3:0;
  const rest=10-nrc; let nsc=Math.round(rest*w.sc/(w.sc+w.rs)); nsc=Math.min(rest-2,Math.max(2,nsc));
  const items=[...pickTop("sc",nsc,t),...pickTop("rs",rest-nsc,t),...(nrc?bestPassage(t,3).items:[])];
  return {qs:items.map(prepQ),why:explainSet(items)};
}
function drillSet(type){
  const t=today();
  const items=type==="rc"?bestPassage(t,5).items:pickTop(type,8,t);
  return {qs:items.map(prepQ),why:explainSet(items)};

function addMissWord(q,t){

  if(!en||en.length>=40) return false;
  if(!S.custom.find(w=>w.en===en) && !HE[en]){ S.custom.unshift({en,he:q.wordHe||""}); added=true; }
  if(S.cards[en]){ S.cards[en].box=0; S.cards[en].due=t; }
  else if(HE[en] && !S.custom.find(w=>w.en===en)){ S.custom.unshift({en,he:HE[en]}); added=true; }
  S.custom=S.custom.slice(0,150);
  return added;
}

function rgShopGen(){
  const rg=S.rg, own=new Set(rg.jokers.map(j=>j.id));
  const pool=JOKERS.filter(j=>!own.has(j.id)), pick=[];
  for(let n=0;n<2&&pool.length;n++){
    const rr=Math.random(), want=rr<0.6?1:rr<0.9?2:3;
    let cand=pool.filter(j=>j.r===want&&!pick.includes(j.id)); if(!cand.length) cand=pool.filter(j=>!pick.includes(j.id)); if(!cand.length) break;
    pick.push(cand[Math.floor(Math.random()*cand.length)].id);
  }
  const ups=shuffle(["pair","pair","two","three","three","straight","flush","flush","full","four","high"]);
  const u=[]; for(const t of ups){ if(!u.includes(t)) u.push(t); if(u.length===2) break; }
  rg.shop={j:pick,u,reroll:5};
}

function rgAct(a,arg){

  else if(a==="rgexit"){ vmode="cards"; render(); window.scrollTo({top:0}); }
  else if(a==="rgskip"){ if(rg.phase==="score"&&!rg.animDone){ rgAnimTok++; rg.animDone=true; render(); } }
  else if(a==="rgplay") rgPlay();
  else if(a==="rgsuggest"){ if(rg.phase!=="play") return; const b=rgBest(); if(b){ rg.sel=b.cs.map(c=>c.id); rg.fresh=[]; tone([[660,.05,0],[880,.06,.05]]); persist(); render(); } }

  else if(a==="rgcont") rgAfterScore();
  else if(a==="rgshop") rgToShop();
  else if(a==="rgadv") rgAdvance();
  else if(a==="rgjinfo"){ rg.jinfo=rg.jinfo===+arg?-1:+arg; rg.fresh=[]; render(); }
  else if(a==="rgbuyj"){ const J=JK[arg]; if(!J||rg.coins<J.p) return; if(rg.jokers.length>=5){ toast("יש לך כבר 5 ג'וקרים","מכור אחד כדי לפנות מקום"); return; } rg.coins-=J.p; rg.jokers.push({id:J.id,v:0}); rg.shop.j=rg.shop.j.filter(x=>x!==J.id); tone(SND.collect); persist(); render(); }
  else if(a==="rgbuyu"){ if(rg.coins<3||!rg.shop.u.includes(arg)) return; rg.coins-=3; rg.lv[arg]=(rg.lv[arg]||1)+1; rg.shop.u=rg.shop.u.filter(x=>x!==arg); tone(SND.collect); toast("📘 "+RG_HANDS[arg][0]+" עלה לרמה "+rg.lv[arg]); persist(); render(); }
  else if(a==="rgsell"){ const i=+arg, j=rg.jokers[i]; if(!j) return; rg.coins+=Math.floor(JK[j.id].p/2); rg.jokers.splice(i,1); rg.jinfo=-1; persist(); render(); }
  else if(a==="rgreroll"){ if(rg.coins<rg.shop.reroll) return; rg.coins-=rg.shop.reroll; const r=rg.shop.reroll+1; rgShopGen(); rg.shop.reroll=r; persist(); render(); }
  else if(a==="rgquit"){ if(rg.phase==="over"||rg.phase==="won"){ S.rg=null; persist(); render(); } else if(rg.quitAsk&&Date.now()-rg.quitAsk<4000){ rg.quitAsk=0; rgEnd(false); } else { rg.quitAsk=Date.now(); toast("לחץ שוב כדי לוותר על הריצה"); } }
  else if(a==="rgnew"){ startRun(); }
}

let rgKeep=null;
function rgBeforeRender(){ const x=document.querySelector(".rgx"); rgKeep=x?{ph:x.dataset.ph,top:x.scrollTop}:null; }
function rgAfterRender(){
  const x=document.querySelector(".rgx");
  document.body.classList.toggle("rgopen",!!x);
  if(!x) return;
  if(rgKeep&&rgKeep.ph===x.dataset.ph) x.scrollTop=rgKeep.top;
  const rg=S.rg; if(!rg) return;
  if(rg.phase==="quiz") rgClock();
  if(rg.phase==="score"&&!rg.animDone) rgAnimate();

}
function rgFloat(el,txt,cls){
  if(!el) return; const x=document.querySelector(".rgx"); if(!x) return;
  const r=el.getBoundingClientRect(), f=document.createElement("div");
  f.className="rgfloat "+cls; f.dir="ltr"; f.textContent=txt; f.style.left=(r.left+r.width/2)+"px"; f.style.top=(r.top-6)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(),950);
}
function rgBump(el,cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function rgCount(el,from,to,ms){
  if(!el) return; const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e).toLocaleString(); if(k<1&&document.body.contains(el)) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function rgAnimate(){
  const rg=S.rg, r=rg.res, tok=++rgAnimTok;
  clearTimeout(rgAutoT);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finish=()=>{ if(tok!==rgAnimTok||!S.rg||S.rg.phase!=="score") return; rg.animDone=true;
    const tot=document.getElementById("rgTot"), ver=document.getElementById("rgVer"), sc=document.getElementById("rgScore"), pr=document.getElementById("rgProg");
    if(tot){ tot.classList.add("show"); const b=tot.querySelector("b bdi"); if(b) rgCount(b,0,r.total,500); }
    if(r.total>0) tone(SND.combo);
    setTimeout(()=>{ if(tok!==rgAnimTok) return; if(sc){ const b=sc.querySelector("bdi"); rgCount(b,rg.scoreBefore,rg.score,650); rgBump(sc,"bump"); } if(pr) pr.style.width=Math.min(100,Math.round(rg.score/rg.target*100))+"%"; if(ver) ver.classList.add("show");
      if(rg.score>=rg.target){ tone(SND.level); if(!reduce) confetti(); }
      else if(rg.hands>0){ rgAutoT=setTimeout(()=>{ if(tok===rgAnimTok&&S.rg&&S.rg.phase==="score"&&tab==="vocab"&&vmode==="run") rgAfterScore(); },1600); }
    }, reduce?0:450);
  };
  if(reduce||!r.type){ setTimeout(finish,reduce?0:300); return; }
  const C=document.getElementById("rgC"), M=document.getElementById("rgM");
  let t=350;
  r.steps.forEach((s,i)=>{
    setTimeout(()=>{
      if(tok!==rgAnimTok) return;
      if(C) C.textContent=s.c; if(M) M.textContent=s.m;
      if(s.k==="card"){ const el=document.querySelector('[data-pi="'+s.i+'"]'); rgBump(el,"pop"); rgFloat(el,s.txt,"chips"); rgBump(C,"bump"); tone([[330+i*45,.07,0]]); }
      else { const el=document.querySelector('[data-ji="'+s.j+'"]'); rgBump(el,"wig"); rgFloat(el,s.txt,s.kind==="c"?"chips":"mult"); rgBump(s.kind==="c"?C:M,"bump"); tone([[s.kind==="x"?660:520,.09,0],[s.kind==="x"?880:620,.08,.06]]); }
    },t);
    t+=s.k==="card"?330:430;
  });
  setTimeout(finish,t+120);
}

      return {sys:AI_SYS,user:u};
    },
    check(o,c){
      const skillsFor={sc:["vocab","logic","contrast","cause"],rs:["neg","cond","time","comp","cause","contrast","quant"],rc:["main","detail","vctx","infer"]}[c.type];
      const items=[];
      for(const it of (o&&Array.isArray(o.items)?o.items:[])){
        const opts=Array.isArray(it&&it.options)?it.options.map(x=>clip(x,300)).filter(Boolean):[];
        const ans=+it.answer;
        if(!it.stem||opts.length!==4||new Set(opts.map(x=>x.toLowerCase())).size!==4||!(ans>=0&&ans<=3)) continue;
        if(c.type==="sc"&&!/_{2,}/.test(it.stem)) continue;
        items.push({stem:clip(it.stem,600),options:opts,answer:ans,explain:isHe(it.explain)?clip(it.explain,600):"",d:[1,2,3].includes(+it.d)?+it.d:2,skill:skillsFor.includes(it.skill)?it.skill:skillsFor[0]});
      }
      if(c.type==="rc"&&!(o&&typeof o.passage==="string"&&o.passage.split(/\s+/).length>=80)) throw new Error("לא התקבל קטע קריאה תקין.");
      if(items.length<2) throw new Error("בתשובה לא נמצאו מספיק שאלות תקינות.");
      return {type:c.type,topic:clip(o.topic,80),passage:c.type==="rc"?clip(o.passage,3000):"",items:items.slice(0,10)};
    }
  }
};
function aiParse(raw){
  let s=String(raw||"").trim();
  const f=s.match(/```(?:json)?\s*([\s\S]*?)```/i); if(f) s=f[1].trim();
  const a=s.indexOf("{"), b=s.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("לא מצאתי JSON בתשובה. ודא שהעתקת את כל התשובה.");
  try{ return JSON.parse(s.slice(a,b+1)); }catch(e){ throw new Error("התשובה לא בפורמט תקין. בקש מה-AI להחזיר JSON בלבד ונסה שוב."); }
}

async function aiFetch(url,opt,ms){

  catch(e){ throw new Error(e.name==="AbortError"?"ה-AI לא ענה בזמן. נסה שוב.":"אין חיבור לשירות ה-AI. בדוק את האינטרנט."); }
  finally{ clearTimeout(to); }
}
function aiErr(r,j){

  if(r.status===401||r.status===403) return "המפתח לא תקין או שאין לו הרשאה. בדוק אותו בהגדרות.";

}

  let h='<section class="sheet aihero"><div class="row" style="justify-content:space-between;gap:10px"><div><h2 style="margin:0">🤖 העוזר החכם</h2><p class="small muted" style="margin:4px 0 0">'+aiBadge()+'</p></div><button class="btn ghost mini" data-act="aigoset">⚙️ חיבור</button></div>';
  if(!aiOn()) return h+'<p>העוזר כבוי. אפשר להפעיל אותו בהגדרות, עם המנוי שכבר יש לך ל-ChatGPT, Gemini או Claude.</p><button class="btn" data-act="aigoset">להפעלה</button></section>';
  h+='</section>';
  const f=aiForm, sel=(k,opts,cur)=>'<select data-ai-form="'+k+'">'+opts.map(([v,l])=>'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+l+'</option>').join('')+'</select>';

  h+='<label class="field">נושא<input type="text" data-ai-form="topic" maxlength="60" value="'+esc(f.topic)+'" placeholder="למשל: כלכלה, רפואה, סביבה"></label><div class="row aiformrow"><label class="field">רמה'+sel("lv",[[1,"בסיסית"],[2,"בינונית"],[3,"גבוהה"]],f.lv)+'</label><label class="field">כמה מילים'+sel("n",[[10,"10"],[20,"20"],[30,"30"]],f.n)+'</label></div>';

  else h+='<p class="small muted">ה-AI עובר על הנתונים שלך (אחוזים לפי פרק ומיומנות, מילים קשות, ימים עד המבחן) ובונה תוכנית לשבוע.</p><button class="btn" data-act="aicoach">בנה לי תוכנית</button>';
  h+='</section>';
  h+='<section class="sheet aitool"><h3>🎯 מחולל תרגול</h3><p class="small muted">שאלות חדשות בסגנון אמירנט, עם דגש על המיומנויות החלשות שלך.</p><div class="row aiformrow"><label class="field">סוג'+sel("ptype",[["sc","השלמת משפטים"],["rs","ניסוח מחדש"],["rc","הבנת הנקרא"]],f.ptype)+'</label>'+(f.ptype==="rc"?'':'<label class="field">כמה'+sel("pn",[[5,"5"],[8,"8"],[10,"10"]],f.pn)+'</label>')+'</div><button class="btn" data-act="aigen">צור תרגול</button>';
  if(c.items.length) h+='<p class="small muted" style="margin-bottom:0">שמורות '+c.items.length+' שאלות שנוצרו. <button class="linkish" data-act="aiagain">תרגל אותן שוב</button></p>';
  h+='</section>';
  const last=S.attempts.slice().reverse().find(x=>!x.ok&&x.id&&ITEMS.some(it=>it.id===x.id));
  h+='<section class="sheet aitool"><h3>💡 מסביר טעויות</h3><p class="small muted">בכל שאלה שתטעה בה יופיע כפתור "🤖 למה טעיתי?", וגם במשחק הג\'וקרים על מילה שפספסת.</p>'+(last?'<button class="btn ghost" data-act="aiwhylast">הסבר את הטעות האחרונה שלי</button>':'')+'</section>';

    for(const s of c.sets) h+='<div class="aisetrow"><div><b>'+esc(s.title)+'</b><small class="muted">'+s.words.length+' מילים · '+dm(s.date)+'</small></div><button class="btn mini" data-act="aisetrun" data-arg="'+s.id+'">🃏 שחק</button><button class="btn ghost mini" data-act="aisetdel" data-arg="'+s.id+'" aria-label="מחק">🗑️</button></div>';
