function aiHomeHTML(){
  const c=aiCfg();
  if(!aiOn()||!c.plan) return '';
  return '<section class="sheet aihome"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🧭 התוכנית מהמאמן</h3><button class="btn ghost mini" data-act="tab" data-arg="ai">לתוכנית המלאה</button></div>'+(c.plan.focus.length?'<ul>'+c.plan.focus.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>':'')+'</section>';
}
function aiAfterRender(){
  const nav=document.getElementById("nav"); if(nav){
    let b=nav.querySelector('[data-arg="ai"]');
    if(aiOn()&&!b){ b=document.createElement("button"); b.dataset.act="tab"; b.dataset.arg="ai"; b.textContent="עוזר"; nav.appendChild(b); }
    else if(!aiOn()&&b) b.remove();
    if(b&&aiOn()) b.setAttribute("aria-current",tab==="ai"?"page":"false");
  }
  let root=document.getElementById("aiRoot");
  if(!root){ root=document.createElement("div"); root.id="aiRoot"; document.body.appendChild(root); }
  root.innerHTML=aiJob?aiSheetHTML():"";
  document.body.classList.toggle("aiopen",!!aiJob);
}
function aiAct(a,arg){
  const c=aiCfg();
  if(a==="aiclose"){ aiJob=null; render(); }
  else if(a==="aigoset"){ aiJob=null; tab="settings"; render(); setTimeout(()=>{ const e=document.getElementById("aiSettings"); if(e) e.scrollIntoView({behavior:"smooth"}); },50); }
  else if(a==="aiset"){ if(!aiForm.topic.trim()&&!aiForm.text.trim()){ toast("כתוב נושא או הדבק טקסט"); return; } aiStart("set",{topic:aiForm.topic.trim(),lv:+aiForm.lv,n:+aiForm.n,text:aiForm.text.trim()}); }
  else if(a==="aicoach") aiStart("coach",{});
  else if(a==="aigen") aiStart("practice",{type:aiForm.ptype,n:aiForm.ptype==="rc"?5:+aiForm.pn});
  else if(a==="aiagain"){ const its=shuffle(c.items).slice(0,10); if(its.length) aiPractice(its); }
  else if(a==="aiwhylast"){ const x=S.attempts.slice().reverse().find(x=>!x.ok&&x.id&&ITEMS.some(it=>it.id===x.id)); if(x){ const q=prepQ(ITEMS.find(it=>it.id===x.id)); aiStart("why",{q,chosen:-1}); } }
  else if(a==="aiwhy"){ const q=ps&&ps.qs[ps.i]; if(!q) return; const cached=c.why[q.id]; if(cached){ aiJob={task:"why",ctx:{q},title:"למה טעיתי?",phase:"done",res:cached}; render(); } else aiStart("why",{q,chosen:ps.chosen}); }
  else if(a==="aiword"){ const en=arg, cached=c.why["w:"+en]; if(cached){ aiJob={task:"word",ctx:{en},title:"עזרה עם המילה "+en,phase:"done",res:cached}; render(); } else { const rg=S.rg, q=rg&&rg.q; aiStart("word",{en,he:heOf(en),wrong:q&&rg.chosen>=0&&rg.chosen!==q.answer?q.options[rg.chosen]:""}); } }
  else if(a==="aicopy"){ const t=aiPromptText(aiJob); const done=()=>toast("📋 הבקשה הועתקה","עכשיו הדבק אותה בצ'אט"); try{ navigator.clipboard.writeText(t).then(done,()=>{ aiCopyFallback(t); done(); }); }catch(e){ aiCopyFallback(t); done(); } }
  else if(a==="aiparse"){ const v=(document.getElementById("aiPaste")||{}).value||aiJob.paste; aiJob.paste=v; aiFinish(aiJob,v); }
  else if(a==="airetry"){ if(aiJob){ aiJob.phase=aiCfg().mode==="paste"?"paste":"loading"; aiJob.err=""; render(); if(aiJob.phase==="loading") aiExec(aiJob); } }
  else if(a==="aisaveset"||a==="aisetplay"){ const id=aiSaveSet(aiJob.res); persist(); aiJob=null; if(a==="aisetplay") aiSetRun(id); else { toast("✅ הסט נוסף","המילים יופיעו ראשונות בכרטיסיות"); render(); } }
  else if(a==="aipractice"){ const items=aiSaveItems(aiJob.res); persist(); aiJob=null; aiPractice(items); }
  else if(a==="aisetrun") aiSetRun(arg);
  else if(a==="aisetdel"){ c.sets=c.sets.filter(s=>s.id!==arg); persist(); render(); }
  else if(a==="aikeysave"){ const v=(document.getElementById("aiKeyIn")||{}).value||""; if(v.trim().length<12){ toast("המפתח קצר מדי"); return; } aiSaveKey(v); aiTest=""; aiModels=null; render(); toast("🔒 המפתח נשמר במכשיר"); }
  else if(a==="aikeydel"){ aiSaveKey(""); aiTest=""; aiModels=null; render(); }
  else if(a==="aimodels"){ aiTest="טוען מודלים…"; render(); aiListModels().then(ids=>{ aiModels={prov:c.prov,ids}; if(!ids.includes(aiModel())){ c.models=Object.assign(c.models||{},{[c.prov]:aiPickDefault(ids)}); persist(); } aiTest="✅ נמצאו "+ids.length+" מודלים. נבחר "+esc(aiModel())+"."; render(); },e=>{ aiTest="⚠️ "+esc(e.message); render(); }); }
  else if(a==="aitest"){ aiTest="בודק…"; render(); aiCall(AI_SYS,'Return {"ok":true,"he":"שלום"}').then(t=>{ aiParse(t); aiTest="✅ החיבור עובד ("+esc(aiModel())+")."; render(); },e=>{ aiTest="⚠️ "+esc(e.message); render(); }); }
}
function aiCopyFallback(t){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); }
document.addEventListener("change",e=>{
  const el=e.target; if(!el) return;
  const k=el.dataset&&el.dataset.aiSet;
  if(k){ const c=aiCfg(); if(k==="mode"){ if(el.value==="cloud"&&!AI_CLOUD_URL){ toast("המסלול בתשלום ייפתח עם הגרסה לחנויות"); render(); return; } c.mode=el.value; }
    else if(k==="prov"){ c.prov=el.value; aiModels=null; aiTest=""; }
    else if(k==="model"){ c.models=Object.assign(c.models||{},{[c.prov]:el.value.trim()}); }
    persist(); render(); return; }
  const f=el.dataset&&el.dataset.aiForm; if(f){ aiForm[f]=el.value; if(f==="ptype") render(); }
});
document.addEventListener("input",e=>{
  const el=e.target; if(!el) return;
  if(el.id==="aiPaste"&&aiJob) aiJob.paste=el.value;
  const f=el.dataset&&el.dataset.aiForm; if(f&&(f==="topic"||f==="text")) aiForm[f]=el.value;
});

/* ---------- v3.5: always-visible goal tracker ---------- */
const GOAL_NAMES={100:"מתקדמים א׳",120:"מתקדמים ב׳",134:"פטור"};
const CUTOFF_NOTE="ספי הרמות (100, 120, 134) נפוצים במוסדות רבים, למשל באוניברסיטת תל אביב. מאל״ו לא קובע אותם: כל מוסד מחליט בעצמו, אז כדאי לבדוק במוסד שלך.";
const EST_NOTE="אומדן תרגול: מחושב מהתשובות שלך באפליקציה ולא מכויל מול ציונים רשמיים של מאל״ו. השתמש בו כדי לראות מגמה, לא כתחזית.";
let goalOpen=false;
function goalOf(){ return {name:GOAL_NAMES[S.target]||("ציון "+S.target)}; }
function recentAcc(){
  const a=S.attempts.filter(x=>!x.sim).slice(-60);
  if(a.length<15) return null;
  return Math.round(a.filter(x=>x.ok).length/a.length*100);
}
function goalSnap(){
  const t=today(), m=masteredN(), e=estimate();
  S.gh=S.gh||{};
  const prev=S.gh[t];
  if(!prev||prev.m!==m||prev.e!==e){ S.gh[t]={m,e}; const ks=Object.keys(S.gh).sort(); if(ks.length>120) for(const k of ks.slice(0,ks.length-120)) delete S.gh[k]; }
}
function wordPace(){
  const ks=Object.keys(S.gh||{}).sort(); if(ks.length<2) return null;
  const t=today(), ref=ks.filter(k=>diff(k,t)>=1&&diff(k,t)<=14);
  if(!ref.length) return null;
  const k=ref[0], days=Math.max(1,diff(k,t));
  return Math.max(0,(masteredN()-S.gh[k].m)/days);
}
/* readiness = practice estimate vs. chosen target ONLY. Vocabulary and accuracy are shown as information,
   never as requirements (no official vocabulary/accuracy thresholds exist). */
function goalState(){
  const est=estimate(), acc=recentAcc(), m=masteredN(), left=Math.max(0,diff(today(),S.examDate)), vg=S.vocabGoal||null;
  const score=est?{v:Math.max(0,Math.min(1,(est-50)/(S.target-50))),cur:est,gap:Math.max(0,S.target-est)}:null;
  const words={m,goal:vg,v:vg?Math.min(1,m/vg):null,gap:vg?Math.max(0,vg-m):0};
  const pct=score?Math.round(score.v*100):null;
  const pace=wordPace(), perDay=vg&&left>0?Math.ceil(words.gap/left):null;
  return {g:goalOf(),score,words,acc,pct,left,pace,perDay,need:Math.max(0,15-S.attempts.length)};
}
function goalRing(p,size){
  const r=size/2-4, c=2*Math.PI*r, off=c*(1-Math.min(1,p/100));
  return '<svg class="gring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" class="gr-bg"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" class="gr-fg" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}
function goalBarHTML(){
  const s=goalState();
  let h='<button class="gb-main" data-act="goaltoggle" aria-expanded="'+goalOpen+'"><span class="gb-ring">'+goalRing(s.pct||0,40)+'<b>'+(s.pct==null?'—':s.pct+'%')+'</b></span><span class="gb-txt"><b>'+(s.score?'אומדן מול יעד '+s.g.name:'יעד: '+s.g.name+' ('+S.target+')')+'</b><small>'+(s.score?'אומדן תרגול ~'+s.score.cur+' · יעד '+S.target:'עוד אין אומדן · עוד '+s.need+' תשובות בתרגול')+(s.left?' · '+s.left+' ימים':'')+'</small></span><span class="gb-chips"><span title="מילים בשליטה (נבדקו בחזרה מאוחרת)">📚 <bdi>'+s.words.m.toLocaleString()+(s.words.goal?'/'+s.words.goal.toLocaleString():'')+'</bdi></span>'+(s.acc!=null?'<span title="דיוק ב-60 התשובות האחרונות">🎯 '+s.acc+'%</span>':'')+'</span><span class="gb-chev">'+(goalOpen?'▴':'▾')+'</span></button>';
  if(goalOpen) h+=goalDetailHTML(s);
  return h;
}
function goalMeter(ic,title,v,now,need,note){
  const p=Math.round(Math.min(1,v||0)*100);
  return '<div class="gm"><div class="gm-top"><span>'+ic+' <b>'+title+'</b></span><span class="gm-num" dir="ltr">'+now+(need!=null?' / '+need:'')+'</span></div>'+(v!=null?'<div class="gm-bar"><i style="width:'+p+'%"></i></div>':'')+(note?'<small>'+note+'</small>':'')+'</div>';
}
function goalDetailHTML(s){
  let h='<div class="gb-detail"><div class="gb-goals">'+[100,120,134].map(v=>'<button class="gb-goal'+(S.target===v?' on':'')+'" data-act="goalset" data-arg="'+v+'">'+GOAL_NAMES[v]+'<small>'+v+'</small></button>').join('')+'</div>';
  h+=s.score?goalMeter("🏁","אומדן תרגול מול היעד",s.score.v,'~'+s.score.cur,S.target,s.score.gap?'האומדן נמוך מהיעד בכ-'+s.score.gap+' נקודות.':'האומדן הגיע ליעד. המשך לתרגל כדי לוודא שזה יציב.'):goalMeter("🏁","אומדן תרגול",null,'—',null,'אין עדיין אומדן. הוא יופיע אחרי 15 תשובות בתרגול או בסימולציה (עוד '+s.need+').');
  const opts=[0,1000,2000,3000,4000,5000].map(v=>'<option value="'+v+'"'+((S.vocabGoal||0)===v?' selected':'')+'>'+(v?v.toLocaleString()+' מילים':'בלי יעד')+'</option>').join('');
  h+=goalMeter("📚","מילים בשליטה",s.words.v,s.words.m.toLocaleString(),s.words.goal?s.words.goal.toLocaleString():null,'מילה נחשבת "בשליטה" רק אחרי שזכרת אותה גם בחזרה מאוחרת.'+(s.words.goal?' זה יעד אישי שבחרת, לא דרישה של המבחן'+(s.perDay!=null?': כדי להגיע אליו עד המבחן צריך ~'+s.perDay+' ביום':'')+(s.pace!=null?' · הקצב שלך: '+(Math.round(s.pace*10)/10)+' ביום':'')+'.':''))+'<label class="gb-vg small">יעד מילים אישי (רשות) <select id="vocabGoalSel">'+opts+'</select></label>';
  h+=goalMeter("🎯","דיוק בתרגול (60 אחרונות)",null,s.acc!=null?s.acc+'%':'—',null,s.acc!=null?'מידע בלבד. אין סף דיוק רשמי.':'יופיע אחרי 15 שאלות תרגול.');
  const next=s.score?["סט חכם מתמקד בחולשות שלך",'goalsmart','',"לסט חכם"]:["סימולציה או תרגול ייתנו אומדן ראשון",'goalgo','practice',"לתרגול"];
  h+='<div class="gb-next"><span>👉 '+next[0]+'</span><button class="btn mini" data-act="'+next[1]+'"'+(next[2]?' data-arg="'+next[2]+'"':'')+'>'+next[3]+'</button></div>';
  h+='<p class="gb-note">'+EST_NOTE+' '+CUTOFF_NOTE+'</p></div>';
  return h;
}
function goalAfterRender(){
  goalSnap();
  let gb=document.getElementById("goalbar");
  if(!gb){ const hd=document.querySelector(".wrap>header")||document.querySelector("header"); if(!hd) return; gb=document.createElement("div"); gb.id="goalbar"; gb.className="goalbar"; hd.insertAdjacentElement("afterend",gb); }
  gb.innerHTML=goalBarHTML();
  gb.classList.toggle("open",goalOpen);
  const s=goalState();
  if(s.score&&s.score.cur>=S.target&&S.goalHit!==S.target){ S.goalHit=S.target; fxQ.push({t:"ach",ic:"🏆",ti:"אומדן התרגול הגיע ליעד "+s.g.name}); persist(); }
}
document.addEventListener("change",e=>{ if(e.target&&e.target.id==="vocabGoalSel"){ S.vocabGoal=+e.target.value||null; persist(); render(); } });

function render(){
  const left=diff(today(),S.examDate);
  document.getElementById("sub").textContent = left>0 ? "מ-"+S.base+" ("+band(S.base)+") ל-"+S.target+" ("+band(S.target)+"). נשארו "+left+" ימים עד המבחן ב-"+dm(S.examDate)+"." : left===0 ? "היום המבחן." : "עדכן את תאריך המבחן בהגדרות.";
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.arg===tab?"page":"false"));
  const m=document.getElementById("main");
  document.body.classList.toggle("insim", !!(sim&&sim.phase==="run"&&tab==="practice"));
  const th=S.theme||"auto"; if(th==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",th);
  rgBeforeRender();
  m.innerHTML = tab==="today"?viewTodayV3():tab==="vocab"?viewVocab():tab==="practice"?(sim?viewSim():viewPractice()):tab==="settings"?viewSettings():tab==="ai"?viewAI():viewStats();
  if(tab==="vocab" && autoSpeak()){
    let key="", word="";
    if(vmode==="cards" && vs && vs.i<vs.queue.length && !vs.revealed){ word=vs.queue[vs.i].en; key="c"+vs.i+word; }
    else if(vmode==="quiz" && vq && vq.i<vq.qs.length && !vq.qs[vq.i].rev && vq.chosen===null){ word=vq.qs[vq.i].en; key="q"+vq.i+word; }
    else if(vmode==="phr" && pq && pq.i<pq.qs.length && !pq.qs[pq.i].rev && pq.chosen===null){ word=pq.qs[pq.i].en; key="p"+pq.i+word; }
    if(key && key!==lastSpoken){ lastSpoken=key; speak(word); }
  }
  const gi=document.getElementById("gIn"); if(gi && window.matchMedia("(pointer:fine)").matches) gi.focus();
  rgAfterRender();
  aiAfterRender();
  goalAfterRender();
  runFx();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, arg=b.dataset.arg;
  if((a==="tab"||a==="go"||a==="vmode") && spr && !spr.done && !(a==="vmode"&&arg==="sprint")) stopSprint();
  if(a==="tab"||a==="go"){ tab=arg; if(arg==="vocab"&&vs&&vs.i>=vs.queue.length) vs=null; render(); window.scrollTo({top:0}); }
  else if(a==="vmode"){ if(arg==="boss"&&boss&&boss.ended) boss=null; if(arg==="sprint"&&spr&&spr.done) spr=null; vmode=arg; if(arg==="quiz"&&vq&&vq.i>=vq.qs.length) vq=null; if(arg==="phr"&&pq&&pq.i>=pq.qs.length) pq=null; if(arg==="conn"&&cq&&cq.i>=cq.qs.length) cq=null; render(); if(arg==="dict"){ const d=document.getElementById("dIn"); if(d&&window.matchMedia("(pointer:fine)").matches) d.focus(); } }
  else if(a==="pqa") pqAnswer(+arg);
  else if(a==="vhint"){ if(vs){ vs.hint=true; render(); } }
  else if(a==="sprgo"){ vmode="sprint"; startSprint(); }
  else if(a==="spra") sprAnswer(+arg);
  else if(a==="rghome"){ tab="vocab"; vmode="run"; render(); window.scrollTo({top:0}); }
  else if(a.startsWith("rg")) rgAct(a,arg);
  else if(a.startsWith("ai")) aiAct(a,arg);
  else if(a==="goaltoggle"){ goalOpen=!goalOpen; render(); }
  else if(a==="goalset"){ S.target=+arg; S.goalHit=null; persist(); render(); }
  else if(a==="goalgo"){ goalOpen=false; tab=arg; render(); window.scrollTo({top:0}); }
  else if(a==="goalsmart"){ goalOpen=false; tab="practice"; startSet(smartSet(),"smart"); }
  else if(a==="bossgo"){ vmode="boss"; if(hardList().length) startBoss(); else { boss=null; render(); } }
  else if(a==="bossa") bossAnswer(+arg);
  else if(a==="bossnext") bossNext();
  else if(a==="pqnext"){ pq.i++; pq.chosen=null; render(); }
  else if(a==="pqnew"){ pq=null; render(); }
  else if(a==="cqa") cqAnswer(+arg);
  else if(a==="cqnext"){ cq.i++; cq.chosen=null; render(); }
  else if(a==="cqnew"){ cq=null; render(); }
  else if(a==="dadd"){ if(!S.cards[arg]){ S.cards[arg]={box:0,due:today()}; persist(); } b.outerHTML='<span class="tag">נוסף לחזרה</span>'; }
  else if(a==="vqa") vqAnswer(+arg);
  else if(a==="vqnext"){ vq.i++; vq.chosen=null; render(); }
  else if(a==="vqnew"){ vq=null; render(); }
  else if(a==="vreveal"){ if(vs&&!vs.revealed){ vs.revealed=true; vs.flipAnim=true; vs.guess=null; vs.guessOk=null; render(); } }
  else if(a==="next"){ const s=nextStep(); if(s==="cards"||s==="boss"||s==="sprint"){ tab="vocab"; vmode=s; if(s==="cards"&&vs&&vs.i>=vs.queue.length) vs=null; if(s==="boss"&&hardList().length) startBoss(); else render(); } else if(s==="smart"){ tab="practice"; startSet(smartSet(),"smart"); } else if(s==="mist"){ tab="practice"; startSet(mistakeSet(),"mist"); } else { tab="practice"; render(); } window.scrollTo({top:0}); }
  else if(a==="setname"){ const el=document.getElementById("nameIn"), v=(el&&el.value||"").trim().slice(0,20); if(v){ S.name=v; persist(); render(); } else if(el) el.focus(); }
  else if(a==="vguess"){
    const el=document.getElementById("gIn"), g=(el&&el.value||"").trim();
    if(!g){ if(el) el.focus(); return; }
    const c=vs.queue[vs.i]; vs.guess=g; vs.guessOk=guessMatch(g,c.he); vs.revealed=true; vs.flipAnim=true; render();
  }
  else if(a==="say") speak(arg);
  else if(a==="sayslow") speak(arg,true);
  else if(a==="vgrade"){ grade(arg==="1"); }
  else if(a==="vmore"){
    const fresh=freshRandom(10).map(w=>({en:w.en,he:w.he,isNew:true}));
    vs={queue:fresh,i:0,revealed:false,known:0,miss:0,requeued:new Set(),extra:0,xp0:S.xp||0}; render();
  }
  else if(a==="psmart") startSet(smartSet(),"smart");
  else if(a==="pmist"){ if(mistakeItems().length) startSet(mistakeSet(),"mist"); }
  else if(a==="bfile"){ backupFile(); render(); }
  else if(a==="bsnooze"){ S.backupSnooze=addDays(today(),2); persist(); render(); }
  else if(a==="pdrill") startSet(drillSet(arg),"drill");
  else if(a==="pchoose") choose(+arg);
  else if(a==="pnext"){ ps.i++; ps.chosen=null; ps.t0=Date.now(); render(); window.scrollTo({top:0}); }
  else if(a==="pback"){ ps=null; render(); }
  else if(a==="sgen") startSim(simGroups(arg==="short"),arg==="short");
  else if(a==="sstart") startChapter();
  else if(a==="spick"){ sim.ans[sim.ci][sim.qi]=+arg; render(); }
  else if(a==="sgo"){ sim.qi=+arg; sim.confirm=false; render(); }
  else if(a==="sprev"){ if(sim.qi>0) sim.qi--; sim.confirm=false; render(); }
  else if(a==="snext"){ sim.qi++; sim.confirm=false; render(); }
  else if(a==="send"){ sim.confirm=true; render(); }
  else if(a==="scancel"){ sim.confirm=false; render(); }
  else if(a==="sconfirm") endChapter(false);
  else if(a==="sreview"){ sim.phase="review"; render(); window.scrollTo({top:0}); }
  else if(a==="sexit"){ clearInterval(simTick); sim=null; render(); window.scrollTo({top:0}); }
  else if(a==="bexp"){ backup=backup==="exp"?"":"exp"; backupErr=""; if(backup==="exp"){ S.lastBackup=today(); persist(); } render(); }
  else if(a==="bimp"){ backup=backup==="imp"?"":"imp"; backupErr=""; render(); }
  else if(a==="bapply"){
    try{ const v=JSON.parse(document.getElementById("bkIn").value); if(!v||typeof v!=="object"||!v.cards) throw 0; S=Object.assign({},DEFAULT,v); migrate(); vs=null; backup=""; backupErr=""; persist(); }
    catch(e){ backupErr="הטקסט הזה לא נראה כמו גיבוי תקין. העתק אותו שוב מהייצוא."; }
    render();
  }
});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.id==="dIn") return;
  if(e.target&&e.target.id==="gIn"){ if(e.key==="Enter"){ e.preventDefault(); const b=document.querySelector('[data-act="vguess"]'); if(b) b.click(); } return; }
  if(tab==="vocab"&&vmode==="cards"&&vs&&vs.i<vs.queue.length){
    if(e.key===" "&&!vs.revealed){ e.preventDefault(); vs.revealed=true; vs.flipAnim=true; render(); }
    else if(vs.revealed&&(e.key==="1"||e.key==="2")){ grade(e.key==="2"); }
    else if(vs.revealed&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){ e.preventDefault(); grade(e.key==="ArrowRight"); }
  }
});
document.addEventListener("input",e=>{
  if(e.target&&e.target.id==="dIn"){ dictQ=e.target.value; const r=document.getElementById("dRes"); if(r) r.innerHTML=dictResults(dictQ); }
});
document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="bkFile"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ importBackupText(String(rd.result)); toast("✅ ההתקדמות שוחזרה","מהקובץ "+f.name); }catch(_){ backupErr="הקובץ הזה לא נראה כמו גיבוי תקין."; } render(); };
    rd.readAsText(f); return;
  }
  if(e.target.matches('[data-act-change="autospeak"]')){ S.autoSpeak=e.target.checked; persist(); return; }
  const el=e.target.closest("[data-set]"); if(!el) return;
  const k=el.dataset.set;
  if(k==="examDate"&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)) S.examDate=el.value;
  if(k==="target") S.target=+el.value;
  if(k==="name"){ S.name=String(el.value||"").trim().slice(0,20); persist(); return; }
  if(k==="theme"&&["auto","light","dark"].includes(el.value)) S.theme=el.value;
  if(k==="autoSpeak") S.autoSpeak=el.value==="1";
  if(k==="nwDaily"&&[25,40,60,100].includes(+el.value)) S.nwDaily=+el.value;
  if(k==="xpGoal"&&[150,250,400,600].includes(+el.value)) S.xpGoal=+el.value;
  if(k==="sound"){ S.sound=el.value==="1"; if(S.sound) tone(SND.ok); }
  if(k==="base"){ const v=+el.value; if(v>=50&&v<=150){ S.base=v; if(!S.attempts.length) S.theta=null; } }
  vs=null; persist(); render();
});
document.getElementById("ver").textContent="גרסה "+APP_VERSION;
render();
connect();
if(!IN_CLAUDE){
  try{
    const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
    const i=document.createElement("link"); i.rel="apple-touch-icon"; i.href="icon-192.png"; document.head.appendChild(i);
    if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  }catch(e){}
}
</script>
</body>
</html>
